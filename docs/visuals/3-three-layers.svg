<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1100" height="420" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#1b2733">Three layers that never blur together</text>
  <text x="40" y="80" font-size="16" fill="#6b7885">A conclusion is never stored next to a fact. That is the whole design.</text>

  <rect x="40" y="110" width="1020" height="82" rx="10" fill="#f4f6f8" stroke="#d9dee5"/>
  <text x="64" y="142" font-size="18" font-weight="700" fill="#1b2733">1 · FACTS</text>
  <text x="64" y="168" font-size="15" fill="#6b7885">patients · diagnoses · labs · visits</text>
  <text x="1036" y="142" font-size="14" font-weight="600" fill="#1b2733" text-anchor="end">what actually happened</text>
  <text x="1036" y="168" font-size="14" fill="#6b7885" text-anchor="end">comes from the EHR · never edited by us</text>

  <rect x="40" y="208" width="1020" height="82" rx="10" fill="#eaf6ef" stroke="#bfe0cd"/>
  <text x="64" y="240" font-size="18" font-weight="700" fill="#1b2733">2 · RULES</text>
  <text x="64" y="266" font-size="15" fill="#6b7885">programs · risk tiers · cadences</text>
  <text x="1036" y="240" font-size="14" font-weight="600" fill="#1b2733" text-anchor="end">what the policy says</text>
  <text x="1036" y="266" font-size="14" fill="#6b7885" text-anchor="end">written in YAML · stamped with a version</text>

  <rect x="40" y="306" width="1020" height="82" rx="10" fill="#eaf2fc" stroke="#b9d3f0"/>
  <text x="64" y="338" font-size="18" font-weight="700" fill="#1b2733">3 · CONCLUSIONS</text>
  <text x="64" y="364" font-size="15" fill="#6b7885">enrollments · needs · tasks</text>
  <text x="1036" y="338" font-size="14" font-weight="600" fill="#1b2733" text-anchor="end">what the engine decided</text>
  <text x="1036" y="364" font-size="14" fill="#6b7885" text-anchor="end">throw it away and recompute it exactly</text>

  <g stroke="#9aa7b4" stroke-width="2" fill="none">
    <path d="M550 192 v14" marker-end="url(#c)"/>
    <path d="M550 290 v12" marker-end="url(#c)"/>
  </g>
  <defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9aa7b4"/></marker></defs>
</svg>
